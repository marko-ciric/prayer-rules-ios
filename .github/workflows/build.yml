name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are pointless on a build check, and macOS minutes are scarce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild (iOS Simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # -alltargets rather than -scheme: no scheme is checked into the project,
      # and Xcode's auto-generated ones don't exist on a fresh CI checkout.
      # It also survives the pending rename of the "App" target (CLAUDE.md,
      # Open Work item 2) without needing an edit here.
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -alltargets \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
